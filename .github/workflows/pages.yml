name: build-and-deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * *"   # 매일 05:30 KST — 월별 판 유지, 표시 데이터 갱신
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regression tests (offline fixtures)
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --check src/app.js
          node --test tests/test_app.cjs
      - name: Build (k-skill bccard-eatpl-search → site/)
        run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
